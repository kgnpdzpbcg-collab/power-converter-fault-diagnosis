[project]
name = "power-converter-fault-diagnosis"
version = "0.1.0"
description = "电力变换器故障诊断：数据预处理与测量感知专家模型实验"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
]

[tool.uv]
package = false

# 使用官方 CPU 版 PyTorch，用于本机训练及 Dataset/DataLoader 验证。
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
